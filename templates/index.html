<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Alexa • Smart Voice & Web AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0f172a 0%, #060913 100%);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 820px;
            height: 94vh;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .header {
            padding: 16px 22px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ai-orb {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
            transition: all 0.3s ease;
        }

        .ai-orb.listening {
            background: linear-gradient(135deg, #f43f5e, #fb7185);
            box-shadow: 0 0 24px rgba(244, 63, 94, 0.9);
            transform: scale(1.1);
        }

        .ai-orb.speaking {
            background: linear-gradient(135deg, #10b981, #34d399);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.9);
        }

        .brand-info h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .brand-info p {
            font-size: 0.8rem;
            color: #38bdf8;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-group {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.16);
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .timer-group.paused {
            background: rgba(148, 163, 184, 0.16);
            border-color: #94a3b8;
            color: #cbd5e1;
        }

        .timer-ctrl-btn {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fde68a;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .timer-ctrl-btn:hover {
            background: rgba(245, 158, 11, 0.35);
            color: #ffffff;
        }

        .voice-btn {
            background: rgba(30, 41, 59, 0.9);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: 0.2s;
        }

        .voice-btn:hover {
            border-color: #38bdf8;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.94rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot-msg {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            color: #f1f5f9;
            border-bottom-left-radius: 4px;
        }

        .user-msg {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .code-block {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.84rem;
            white-space: pre-wrap;
            background: rgba(6, 11, 25, 0.75);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #cbd5e1;
        }

        .quick-chips {
            padding: 10px 18px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-top: 1px solid rgba(148, 163, 184, 0.12);
            background: rgba(15, 23, 42, 0.75);
        }

        .chip {
            white-space: nowrap;
            background: rgba(30, 41, 59, 0.95);
            color: #cbd5e1;
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #ffffff;
        }

        .input-area {
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(148, 163, 184, 0.15);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mic-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(56, 189, 248, 0.35);
            background: rgba(30, 41, 59, 0.95);
            color: #38bdf8;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .mic-btn.recording {
            background: #e11d48;
            color: white;
            border-color: #fb7185;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.7);
        }

        input[type="text"] {
            flex: 1;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.25);
            color: #f8fafc;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .send-btn {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            opacity: 0.92;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="brand">
                <div class="ai-orb" id="aiOrb"></div>
                <div class="brand-info">
                    <h1>Mini Alexa</h1>
                    <p id="statusText">Online • Voice, Wiki, Tasks & NLP Ready</p>
                </div>
            </div>
            <div class="header-controls">
                <div class="timer-group" id="timerGroup">
                    <span id="timerText">⏱️ 25:00</span>
                    <button class="timer-ctrl-btn" id="pauseResumeBtn" onclick="togglePauseResumeTimer()" title="Pause / Resume Timer">⏸️</button>
                    <button class="timer-ctrl-btn" onclick="stopTimerFromUI()" title="Stop Timer">⏹️</button>
                </div>
                <button class="voice-btn" id="voiceToggleBtn" onclick="toggleVoiceOutput()">🔊 Voice: ON</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-msg">Hi! I'm <strong>Mini Alexa</strong>. What's your name?</div>
        </div>

        <div class="quick-chips">
            <button class="chip" onclick="sendQuickCommand('help')">📋 Help Menu</button>
            <button class="chip" onclick="sendQuickCommand('tell me about artificial intelligence in detail')">📚 Wiki: AI</button>
            <button class="chip" onclick="sendQuickCommand('my tasks')">✅ My Tasks</button>
            <button class="chip" onclick="sendQuickCommand('start 25 minute focus timer')">⏱️ 25m Focus</button>
            <button class="chip" onclick="sendQuickCommand('perceptron')">🧠 Perceptron</button>
            <button class="chip" onclick="sendQuickCommand('summarize')">📝 NLP Analyzer</button>
            <button class="chip" onclick="sendQuickCommand('time')">🕒 Time</button>
            <button class="chip" onclick="sendQuickCommand('joke')">😂 Tech Joke</button>
            <button class="chip" onclick="sendQuickCommand('play game')">🎲 Guessing Game</button>
        </div>

        <div class="input-area">
            <button class="mic-btn" id="micBtn" onclick="startVoiceRecognition()" title="Click to Speak">🎤</button>
            <input type="text" id="userInput" placeholder="Ask anything, manage tasks, or type 'help'..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const aiOrb = document.getElementById("aiOrb");
        const statusText = document.getElementById("statusText");
        const micBtn = document.getElementById("micBtn");
        const voiceToggleBtn = document.getElementById("voiceToggleBtn");
        const timerGroup = document.getElementById("timerGroup");
        const timerText = document.getElementById("timerText");
        const pauseResumeBtn = document.getElementById("pauseResumeBtn");

        let voiceEnabled = true;
        let isListening = false;
        let currentRecognition = null;
        let timerInterval = null;
        let remainingSeconds = 0;
        let isTimerPaused = false;
        let speechQueue = [];
        let isSpeakingQueue = false;

        function stopAllSpeech() {
            speechQueue = [];
            isSpeakingQueue = false;
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
            aiOrb.classList.remove("speaking");
            statusText.innerText = "Online • Voice, Wiki, Tasks & NLP Ready";
        }

        function toggleVoiceOutput() {
            voiceEnabled = !voiceEnabled;
            voiceToggleBtn.innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
            if (!voiceEnabled) {
                stopAllSpeech();
            }
        }

        function playNextChunk() {
            if (!voiceEnabled || speechQueue.length === 0) {
                isSpeakingQueue = false;
                aiOrb.classList.remove("speaking");
                statusText.innerText = "Online • Voice, Wiki, Tasks & NLP Ready";
                return;
            }

            const chunk = speechQueue.shift();
            const utterance = new SpeechSynthesisUtterance(chunk);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onstart = () => {
                isSpeakingQueue = true;
                aiOrb.classList.add("speaking");
                statusText.innerText = "Speaking... (Click Voice button to stop)";
            };

            utterance.onend = () => {
                playNextChunk();
            };

            utterance.onerror = () => {
                playNextChunk();
            };

            window.speechSynthesis.speak(utterance);
        }

        function speakText(text) {
            if (!voiceEnabled || !("speechSynthesis" in window)) return;
            stopAllSpeech();

            const rawSentences = text.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [text];
            for (const s of rawSentences) {
                const trimmed = s.trim();
                if (trimmed) {
                    speechQueue.push(trimmed);
                }
            }

            playNextChunk();
        }

        function renderTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            const prefix = isTimerPaused ? "⏸️" : "⏱️";
            timerText.innerText = `${prefix} ${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        }

        function runTimerTick() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            timerInterval = setInterval(() => {
                if (isTimerPaused) return;
                remainingSeconds -= 1;

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    remainingSeconds = 0;
                    timerGroup.style.display = "none";
                    const doneMsg = "⏰ Time is up! Your focus session is complete. Great job staying on track!";
                    appendMessage(doneMsg, "bot");
                    speakText("Time is up! Your focus session is complete.");
                } else {
                    renderTimerDisplay();
                }
            }, 1000);
        }

        function startCountdownTimer(seconds) {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            if (seconds <= 0) {
                remainingSeconds = 0;
                isTimerPaused = false;
                timerGroup.style.display = "none";
                timerGroup.classList.remove("paused");
                pauseResumeBtn.innerText = "⏸️";
                return;
            }

            remainingSeconds = seconds;
            isTimerPaused = false;
            timerGroup.style.display = "inline-flex";
            timerGroup.classList.remove("paused");
            pauseResumeBtn.innerText = "⏸️";
            renderTimerDisplay();
            runTimerTick();
        }

        function pauseCountdownTimer(announce = false) {
            if (remainingSeconds <= 0 || isTimerPaused) return;
            isTimerPaused = true;
            timerGroup.classList.add("paused");
            pauseResumeBtn.innerText = "▶️";
            renderTimerDisplay();
            if (announce) {
                appendMessage("⏸️ Focus timer paused.", "bot");
                speakText("Focus timer paused.");
            }
        }

        function resumeCountdownTimer(announce = false) {
            if (remainingSeconds <= 0 || !isTimerPaused) return;
            isTimerPaused = false;
            timerGroup.classList.remove("paused");
            pauseResumeBtn.innerText = "⏸️";
            renderTimerDisplay();
            if (announce) {
                appendMessage("▶️ Focus timer resumed.", "bot");
                speakText("Focus timer resumed.");
            }
        }

        function togglePauseResumeTimer() {
            if (isTimerPaused) {
                resumeCountdownTimer(true);
            } else {
                pauseCountdownTimer(true);
            }
        }

        function stopTimerFromUI() {
            startCountdownTimer(0);
            appendMessage("⏹️ Focus timer stopped.", "bot");
            speakText("Focus timer stopped.");
        }

        function appendMessage(text, sender, isCode = false) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", sender === "user" ? "user-msg" : "bot-msg");

            if (isCode) {
                const pre = document.createElement("div");
                pre.classList.add("code-block");
                pre.innerText = text;
                msgDiv.appendChild(pre);
            } else {
                msgDiv.innerText = text;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(customText = null) {
            const text = customText !== null ? customText : userInput.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            if (customText === null) userInput.value = "";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();

                appendMessage(data.reply, "bot", data.is_code || false);

                if (typeof data.timer_seconds === "number") {
                    startCountdownTimer(data.timer_seconds);
                } else if (data.timer_action === "pause") {
                    pauseCountdownTimer(false);
                } else if (data.timer_action === "resume") {
                    resumeCountdownTimer(false);
                }

                if (data.speak) {
                    speakText(data.speak);
                }
            } catch (err) {
                appendMessage("Connection error: Make sure web_app.py is running.", "bot");
            }
        }

        function sendQuickCommand(cmd) {
            sendMessage(cmd);
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support Voice Recognition. Please use Google Chrome or Microsoft Edge.");
                return;
            }

            if (isSpeakingQueue) {
                stopAllSpeech();
            }

            if (isListening && currentRecognition) {
                try { currentRecognition.abort(); } catch (e) {}
                return;
            }

            const recognition = new SpeechRecognition();
            currentRecognition = recognition;
            recognition.lang = "en-US";
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                aiOrb.classList.add("listening");
                micBtn.classList.add("recording");
                statusText.innerText = "Listening... Speak your command";
            };

            recognition.onresult = (event) => {
                let transcript = event.results[0][0].transcript;
                transcript = transcript.replace(/\bakshat\b|\bakshith\b|\baxit\b/gi, "Akshit");
                sendMessage(transcript);
            };

            recognition.onerror = (event) => {
                isListening = false;
                aiOrb.classList.remove("listening");
                micBtn.classList.remove("recording");
                if (event.error !== "aborted") {
                    statusText.innerText = "Mic error: " + event.error;
                }
            };

            recognition.onend = () => {
                isListening = false;
                aiOrb.classList.remove("listening");
                micBtn.classList.remove("recording");
                if (!aiOrb.classList.contains("speaking")) {
                    statusText.innerText = "Online • Voice, Wiki, Tasks & NLP Ready";
                }
            };

            try {
                recognition.start();
            } catch (e) {
                isListening = false;
            }
        }
    </script>
</body>
</html>
